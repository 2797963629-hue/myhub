<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 交互式数据分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .brand-text { color: #0d6efd; font-weight: bold; }

        /* 小黑框样式 */
        .toast-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8); color: white; padding: 12px 24px;
            border-radius: 4px; z-index: 9999; display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-container"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h3 class="brand-text">IDAS 登录</h3>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">账号</label>
                                <input type="text" class="form-control" name="id" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">密码</label>
                                <input type="password" class="form-control" name="pwd" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">立即登录</button>
                            <div class="text-center">
                                <a href="/register_page" class="text-decoration-none">还没有账号？去注册</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function showMsg(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            axios.post('/login', fd).then(r => {
                if(r.data.status === 'success') {
                    window.location.href = '/home';
                } else {
                    showMsg(r.data.msg); // 这里会弹出“账号或密码错误”
                }
            });
        });
    </script>
</body>
</html>
