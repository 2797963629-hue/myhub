<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 交互式数据分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
         .brand-text {
            color: #0d6efd; /* 改回和login一样的蓝色 */
            font-weight: bold;
        }

        /* B站风格小黑框 (Toast) */
        .toast-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            z-index: 9999;
            display: none; /* 初始隐藏 */
            pointer-events: none; /* 防止遮挡点击 */
            font-size: 14px;
            min-width: 150px;
            text-align: center;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-container"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h3 class="brand-text">加入 IDAS</h3>
                            <p class="text-muted small">创建您的分析师账号</p>
                        </div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">账号</label>
                                <input type="text" class="form-control" name="id" placeholder="建议使用字母或数字" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">设置密码</label>
                                <input type="password" class="form-control" name="pwd" placeholder="请输入密码" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">确认密码</label>
                                <input type="password" class="form-control" name="pwd2" placeholder="再次输入密码" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">立即注册</button>
                            <div class="text-center">
                                <span class="text-muted">已有账号？</span>
                                <a href="/login_page" class="text-decoration-none">去登录</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        /**
         * 显示提示消息（小黑框）
         */
        function showMsg(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            toast.style.opacity = '1';

            // 2秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 300);
            }, 2000);
        }

        /**
         * 拦截表单提交
         */
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止页面刷新

            const formData = new FormData(this);

            // 发送 POST 请求到后端的 /register 接口
            axios.post('/register', formData)
                .then(response => {
                    const data = response.data;

                    if (data.status === 'success') {
                        showMsg(data.msg); // 显示“注册成功”
                        // 1.5秒后跳转到登录页面
                        setTimeout(() => {
                            window.location.href = '/login_page';
                        }, 1500);
                    } else {
                        // 显示错误信息（如：两次密码不一致、账号已存在）
                        showMsg(data.msg);
                    }
                })
                .catch(error => {
                    showMsg("服务器繁忙，请稍后再试");
                    console.error(error);
                });
        });
    </script>
</body>
</html>
